name: CI & Build Asura's Path Place

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned Rojo and Luau
        shell: bash
        run: |
          set -euo pipefail
          source tools/toolchain.env
          mkdir -p work/bin/rojo work/bin/luau
          curl --fail --location --retry 3 "https://github.com/rojo-rbx/rojo/releases/download/v${ROJO_VERSION}/rojo-${ROJO_VERSION}-linux-x86_64.zip" -o "$RUNNER_TEMP/rojo.zip"
          unzip -q "$RUNNER_TEMP/rojo.zip" -d work/bin/rojo
          curl --fail --location --retry 3 "https://github.com/luau-lang/luau/releases/download/${LUAU_VERSION}/luau-ubuntu.zip" -o "$RUNNER_TEMP/luau.zip"
          unzip -q "$RUNNER_TEMP/luau.zip" -d work/bin/luau
          chmod +x work/bin/rojo/rojo work/bin/luau/luau work/bin/luau/luau-compile work/bin/luau/luau-analyze
          echo "$PWD/work/bin/rojo" >> "$GITHUB_PATH"
          echo "$PWD/work/bin/luau" >> "$GITHUB_PATH"

      - name: Run Stage 1 & 2 Tests
        run: |
          work/bin/luau/luau tools/test_asura_stage1.luau
          python3 tools/test_asura_stage2.py

      - name: Run Stage 3 Tests & Profile Integrity
        run: |
          work/bin/luau/luau tools/test_asura_stage3.luau
          work/bin/luau/luau tools/test_profile_integrity.luau

      - name: Run Weapons & Spells Tests
        run: |
          work/bin/luau/luau tools/test_weapons_and_spells.luau
          python3 tools/test_weapons_and_spells_runtime.py

      - name: Run Movement, Boss & Objective Tests
        run: |
          python3 tools/test_movement.py
          python3 tools/test_boss_runtime.py
          python3 tools/test_objectives.py
          work/bin/luau/luau tools/test_progression_and_lore.luau
          python3 tools/test_review_regressions.py

      - name: Build Place (AsurasPath.rbxlx)
        run: python3 tools/build.py

      - name: Upload Place Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsurasPath-Place
          path: outputs/AsurasPath.rbxlx
          if-no-files-found: error
